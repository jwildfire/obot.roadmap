# The accept/reject lane for roadmap audit findings (requirements #92, #109).
#
# Two ways in, one path through:
#
#   repository_dispatch  the audit page's buttons, authenticated as @jwildfire
#                        from the browser. This is the primary path (#109) — one
#                        click, no issue, run status reported back on the page.
#   issues               an `audit-decision` issue naming finding ids. Kept as the
#                        documented fallback: an expired token must not mean there
#                        is no way to apply a finding.
#
# The safety contract is identical for both, because neither is trusted with more
# than a list of finding ids:
#   1. the sender must be @jwildfire — inherent for a dispatch, since it is
#      authenticated as the token owner, and checked explicitly for the issue path
#   2. the issue path is idempotent; creating an issue with a label fires both
#      `opened` and `labeled`
#   3. apply_audit_decision.mjs re-runs the whole audit and refuses any finding the
#      current state no longer reports — and reports `blocked`, not stale, when a
#      source it needed was unreadable (#99)
#   4. mechanical findings run a closed vocabulary of ops; judgment calls go to a
#      bounded headless Claude Code run against .github/roadmap-audit-policy.md
#   5. every decision lands in site/audit/decisions.json, which the audit page
#      renders as its Activity log — the record lives where the decision was made
#
# Rejections change nothing on GitHub; they mute the finding for 60 days, or until
# its evidence changes.

name: roadmap-audit-apply

on:
  repository_dispatch:
    types: [audit-decision]
  issues:
    types: [opened, labeled]

concurrency:
  # Board mutations must not interleave, so every decision serializes — a single
  # group rather than one per issue, now that decisions also arrive as dispatches.
  group: roadmap-audit-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    if: >
      (github.event_name == 'repository_dispatch' && github.event.sender.login == 'jwildfire') ||
      (github.event_name == 'issues' && github.actor == 'jwildfire' &&
       contains(github.event.issue.labels.*.name, 'audit-decision'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The token is minted BEFORE checkout and handed to it: actions/checkout
      # persists its credential in .git/config as an http.extraheader, which
      # OVERRIDES any token in a push URL. Checking out with the default token and
      # then pushing with the app token in the URL authenticates as
      # github-actions[bot] — which has contents:read here — and the push is
      # denied. (It was, on run 30142448481.)
      - name: Mint obotclaw[bot] token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.OBOT_APP_ID }}
          private-key: ${{ secrets.OBOT_APP_PRIVATE_KEY }}
          owner: jwildfire

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # One place that turns either event into the same three answers: run or not,
      # which issue (if any), and the arguments for the applier.
      - name: Resolve the decision
        id: decision
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT: ${{ github.event_name }}
          NUM: ${{ github.event.issue.number }}
          SENDER: ${{ github.event.sender.login }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "repository_dispatch" ]; then
            decision=$(printf '%s' "$PAYLOAD" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("decision",""))')
            findings=$(printf '%s' "$PAYLOAD" | python3 -c 'import json,sys; print(",".join(json.load(sys.stdin).get("findings",[])))')
            if [ -z "$decision" ] || [ -z "$findings" ]; then
              echo "::error title=Bad dispatch payload::client_payload needs {decision, findings[]}"
              exit 1
            fi
            n=$(printf '%s' "$findings" | tr ',' '\n' | grep -c .)
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "issue=" >> "$GITHUB_OUTPUT"
            echo "args=--decision $decision --findings $findings" >> "$GITHUB_OUTPUT"
            echo "dispatch: $decision $n finding(s) from @$SENDER" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Issue path: the lane's own marker comment is the repeat-run interlock.
          state=$(gh api "repos/${GITHUB_REPOSITORY}/issues/$NUM" --jq .state)
          handled=$(gh api "repos/${GITHUB_REPOSITORY}/issues/$NUM/comments" --jq '[.[] | select(.body | contains("<!-- audit-apply -->"))] | length')
          if [ "$state" != "open" ] || [ "$handled" != "0" ]; then
            echo "already handled (state=$state, marker comments=$handled) — exiting clean" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "issue=$NUM" >> "$GITHUB_OUTPUT"
            echo "args=--issue $NUM" >> "$GITHUB_OUTPUT"
          fi

      - name: Ack pickup (👀)
        if: steps.decision.outputs.run == 'true' && steps.decision.outputs.issue != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUM: ${{ steps.decision.outputs.issue }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/$NUM/reactions" -f content=eyes --jq .content || true

      - name: Apply the decision
        if: steps.decision.outputs.run == 'true'
        id: apply
        env:
          # Writes: the app token, so every change is attributed to obotclaw[bot].
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Reads: the re-validation audit MUST be able to see the obot Roadmap
          # project, which the app token cannot — a board it cannot read would
          # skip every board rule and report live findings as stale, throwing away
          # a decision @jwildfire actually made. lib/gh.mjs prefers GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
          # Project mutations.
          PROJECT_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
          AUDIT_AGENTIC_PACK: /tmp/audit-agentic.md
          BY: ${{ github.event.sender.login || github.actor }}
        run: |
          set -o pipefail
          node scripts/apply_audit_decision.mjs ${{ steps.decision.outputs.args }} \
            --by "$BY" \
            --run "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --run-id "${GITHUB_RUN_ID}" \
            --report /tmp/report.md | tee /tmp/apply.log

      # The gate is the in-step `-s` test, not an `if:` on the pack file: hashFiles()
      # only sees paths under GITHUB_WORKSPACE, so an `if:` on /tmp would be false
      # forever and the agentic path would silently never run.
      - name: Judgment calls — bounded headless agent
        if: always() && steps.decision.outputs.run == 'true'
        id: agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          if [ ! -s /tmp/audit-agentic.md ]; then
            echo "no agentic findings in this decision" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::warning title=Agentic findings skipped::CLAUDE_CODE_OAUTH_TOKEN is not set"
            echo "skipped: no CLAUDE_CODE_OAUTH_TOKEN" > /tmp/agent-summary.md
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code
          set -o pipefail
          claude -p "You are obot's roadmap-audit apply lane, working the findings @jwildfire accepted in run ${GITHUB_RUN_ID}. FIRST, with the Read tool, read .github/roadmap-audit-policy.md (binding) and /tmp/audit-agentic.md (the accepted findings). Then execute the policy for each finding in order. Finish by writing a short report of what you did, one line per finding, to /tmp/agent-summary.md." \
            --model claude-opus-5 \
            --output-format json \
            --allowedTools "Task,Agent,Bash(gh api:*),Bash(gh issue:*),Bash(gh search:*),Bash(gh project:*),Bash(git diff:*),Bash(echo:*),Read,Write,Edit" \
            | tee /tmp/claude-out.json

      # The agent's outcome is only knowable after it runs, so the ledger records
      # `delegated` up front and is patched here — never guessed in advance.
      - name: Record the agent's outcome
        if: always() && steps.decision.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.ROADMAP_TOKEN != '' && secrets.ROADMAP_TOKEN || steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          [ -s /tmp/audit-agentic.md ] || exit 0
          outcome=applied
          [ "${{ steps.agent.outcome }}" = "success" ] || outcome=failed
          node scripts/apply_audit_decision.mjs --finalize-run "$GITHUB_RUN_ID" --outcome "$outcome"
          # The agent changed GitHub state, so the published findings must be re-derived.
          node scripts/audit_roadmap.mjs >/dev/null || echo "::warning title=Audit refresh failed::findings.json may be one run stale"

      # The ledger IS the page's Activity log (#109), so this commit is what makes a
      # decision visible where it was made. It touches site/**, a deploy trigger.
      - name: Commit the ledger
        if: always() && steps.decision.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- site/audit; then
            echo "no ledger change to commit" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'obotclaw[bot]'
          git config user.email '299836032+obotclaw[bot]@users.noreply.github.com'
          git add site/audit
          git commit -m "Audit decision applied (#92, run ${GITHUB_RUN_ID})"
          # A decision can land while another push is in flight; rebase rather than
          # fail, since the ledger is append-only and cannot conflict semantically.
          for attempt in 1 2 3; do
            git push origin HEAD:main && break
            echo "push rejected (attempt $attempt) — rebasing on main"
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done

      - name: Report to the run summary
        if: always() && steps.decision.outputs.run == 'true'
        run: |
          {
            echo "## Audit decision"
            echo
            cat /tmp/report.md 2>/dev/null || tail -20 /tmp/apply.log 2>/dev/null || echo "(no report produced)"
            if [ -s /tmp/agent-summary.md ]; then echo; echo "### Agent report"; echo; cat /tmp/agent-summary.md; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Issue path only: the decision issue is the surface that asked, so it is the
      # surface that gets answered. Dispatch decisions report on the page instead.
      - name: Report on the decision issue and close it
        if: always() && steps.decision.outputs.run == 'true' && steps.decision.outputs.issue != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUM: ${{ steps.decision.outputs.issue }}
        run: |
          set -uo pipefail
          {
            if [ -s /tmp/report.md ]; then cat /tmp/report.md; else
              echo "## Audit decision failed"
              echo
              echo "The apply step did not produce a report. Run log:"
              echo
              echo '```'
              tail -30 /tmp/apply.log 2>/dev/null || echo "(no output captured)"
              echo '```'
            fi
            if [ -s /tmp/agent-summary.md ]; then
              echo
              echo "### Agent report"
              echo
              cat /tmp/agent-summary.md
            fi
            echo
            echo "[Run log](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) · [audit page](https://jwildfire.github.io/obot.roadmap/audit/)"
            echo
            echo "<!-- audit-apply -->"
          } > /tmp/comment.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/$NUM/comments" -F body=@/tmp/comment.md --jq .html_url
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/$NUM" -f state=closed -f state_reason=completed --jq .state
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/$NUM/reactions/$(gh api "repos/${GITHUB_REPOSITORY}/issues/$NUM/reactions" --jq '[.[] | select(.content=="eyes")][0].id')" >/dev/null 2>&1 || true
          if [ "${{ steps.apply.outcome }}" = "success" ]; then C=+1; else C=confused; fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/$NUM/reactions" -f content="$C" --jq .content || true
