# ideas-triage — continuous triage of the Ideas discussion board (requirement #48).
#
# Fires on every new Ideas discussion or comment and runs a bounded Claude Code
# triage pass: confident ideas become issues (requirement-shaped or plain task)
# and the thread is closed as resolved; unclear ideas get 1-3 targeted questions
# for @jwildfire in-thread. The session-inbox skill in obot.agent remains the
# in-session backstop for anything this lane misses.
#
# Setup (one-time, @jwildfire): mint a subscription token and store it —
#   claude setup-token   →   gh secret set CLAUDE_CODE_OAUTH_TOKEN -R jwildfire/obot.roadmap
# Until the secret exists every run skips silently (job-level guard below).
#
# Loop safety: both jobs hard-exclude bot actors (obotclaw[bot] posts CAN
# re-trigger workflows, so the actor guards are the loop brake) and the pinned
# inbox explainer (#47).
#
# Access model (@jwildfire, 2026-07-24): the full agentic pipeline runs ONLY for
# @jwildfire's posts and comments. Any other human gets a one-time courtesy note
# (no LLM involved) saying the pipeline isn't enabled for them — @jwildfire
# commenting on their thread is what opts it in, since his comment re-triggers
# the triage job with the whole thread as context.

name: ideas-triage

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      discussion:
        description: Discussion number to triage
        required: true

concurrency:
  group: ideas-triage-${{ github.event.discussion.number || inputs.discussion }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  discussions: write

# NOTE: claude-code-action@v1 rejects discussion/discussion_comment events
# ("Unsupported event type", verified 2026-07-24), so the triage job runs
# Claude Code headless (claude -p) on the runner instead.

jobs:
  triage:
    if: >
      github.actor == 'jwildfire' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.discussion.category.name == 'Ideas' &&
        github.event.discussion.number != 47))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check triage token
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Mint obotclaw[bot] token
        if: steps.gate.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.OBOT_APP_ID }}
          private-key: ${{ secrets.OBOT_APP_PRIVATE_KEY }}

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Install Claude Code
        if: steps.gate.outputs.enabled == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Triage the discussion
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUM: ${{ github.event.discussion.number || inputs.discussion }}
        run: |
          cat > /tmp/triage-prompt.md <<EOF
          You are obot's continuous idea-triage lane for the jwildfire/obot.roadmap Ideas board
          (requirement #48; design: requirements/design/48_design.html in this checkout).
          Trigger: activity on discussion #$NUM.

          1. Read the FULL thread first:
             gh api graphql -f query='query{repository(owner:"jwildfire",name:"obot.roadmap"){discussion(number:$NUM){id title body closed author{login} comments(first:50){nodes{author{login} body createdAt}}}}}'
             If the discussion is already closed, stop without acting.

          2. Check for an existing promotion: search open+closed issues for this discussion
             (gh search issues --repo jwildfire/obot.roadmap "discussions/$NUM").
             If one exists, reply with its link only if the thread's newest comment asks about status; otherwise stop.

          3. Classify the idea using the whole thread (later comments override the opening post; ignore
             nudge/notice comments):
             a. CONFIDENT requirement (clear scope, clear why, you could write Business Requirement + Overview
                without guessing): create a Requirement issue via
                gh issue create -R jwildfire/obot.roadmap --title "Requirement: <title>" --label requirement --assignee jwildfire
                (add one topical label — safety, infrastructure, or ai — when it clearly fits).
                Body sections in this order: "### Business Requirement", "### Overview",
                "### Data Requirement" (write "TBD" if unknown), "### Design" (high-level notes or "TBD"),
                "### Tasks" (empty checklist). End the body with the origin link:
                "Promoted from discussion #$NUM: https://github.com/jwildfire/obot.roadmap/discussions/$NUM".
             b. CONFIDENT small concrete task (a chore, fix, or tweak — not requirement-shaped): create a plain
                issue (no requirement label, assignee jwildfire) with a short body plus the same origin link.
             c. NOT CONFIDENT: do not file anything. Post ONE discussion comment addressed to @jwildfire with
                your best reading of the idea and 1-3 targeted questions (numbered, answerable in a sentence).

          4. After filing (3a or 3b only): post a discussion comment linking the new issue, then close the
             discussion as resolved:
             gh api graphql -f query='mutation{closeDiscussion(input:{discussionId:"<the id field from the step-1 query>",reason:RESOLVED}){discussion{number}}}'

          Conventions (binding): GitHub bodies use one line per paragraph or bullet — never hard-wrap.
          Every issue or comment you post ends with a horizontal rule then exactly:
          "This was drafted by obot ideas-triage (Claude Code headless using Sonnet 5) — review by @jwildfire".
          Post at most one comment per run. Act only on discussion #$NUM —
          never edit, close, or comment on anything else, and never delete or edit existing content anywhere.
          EOF
          claude -p "$(cat /tmp/triage-prompt.md)" --model claude-sonnet-5 \
            --allowedTools "Bash(gh api:*),Bash(gh issue:*),Bash(gh search:*),Read"

  access-note:
    if: >
      github.event.discussion.category.name == 'Ideas' &&
      github.event.discussion.number != 47 &&
      github.actor != 'jwildfire' &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint obotclaw[bot] token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.OBOT_APP_ID }}
          private-key: ${{ secrets.OBOT_APP_PRIVATE_KEY }}

      - name: Post access note (once per thread, no LLM)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUM: ${{ github.event.discussion.number }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          data=$(gh api graphql -f query="query{repository(owner:\"jwildfire\",name:\"obot.roadmap\"){discussion(number:$NUM){id comments(last:50){nodes{body}}}}}")
          if echo "$data" | grep -q 'ideas-triage: access-note'; then
            echo "note already present in thread; skipping"
            exit 0
          fi
          id=$(echo "$data" | jq -r '.data.repository.discussion.id')
          body=$(printf 'Thanks for the idea, @%s! The automated triage pipeline currently runs only for posts and comments from @jwildfire — this thread stays in the queue and will be reviewed, but it will not be auto-triaged. Ping @jwildfire if you want the pipeline enabled for you (his reply here also opts the thread in).\n\n<!-- ideas-triage: access-note -->\n\n— obot ideas-triage (automated notice)' "$ACTOR")
          gh api graphql -f query='mutation($d:ID!,$b:String!){addDiscussionComment(input:{discussionId:$d,body:$b}){comment{url}}}' -f d="$id" -f b="$body" --jq '.data.addDiscussionComment.comment.url'
