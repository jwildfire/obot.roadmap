name: Deploy site

# Assembles and deploys the obot.roadmap site (design doc #7 §6). Generators run at
# deploy time so generated pages are never committed; a failed generator fails the
# deploy loudly rather than publishing a stale page silently.
#
# The roadmap's Status grouping reads the user-level obot Roadmap project, which
# the default token cannot see. Add a ROADMAP_TOKEN repo secret (PAT with project
# read) to enable it; the script degrades gracefully without it.
#
# The package status dashboard (scripts/build_status.R, rendered with gh.dash) is
# the exception to "fail loudly": it reads six other repos over the GitHub API, so
# a failure there writes a placeholder page and warns rather than blocking the
# deploy of pages built from this repo's own content.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "diary/**"
      - "reports/**"
      - "scripts/**"
      - "requirements/design/**"
      # The numbers his machine hands this build (#203). Currently the config
      # count: two integers and a date, written by obot.agent/tools/config-count
      # and refused by lib/public-channel.mjs if it ever arrives carrying
      # anything else. A new count should redeploy the pages that render it.
      - "data/**"
      - ".github/workflows/deploy-site.yml"
  schedule:
    - cron: "0 10 * * *" # daily (design decision D4)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.ROADMAP_TOKEN != '' && secrets.ROADMAP_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — build_news.mjs dates artifacts from git log

      # ONE BUILD, ONE LAUNCH TIME. The header's version stamp says when the site
      # shipped, and nine separate node processes below produce the ~82 pages that
      # carry it — with an R toolchain install sitting between some of them. If each
      # took its own clock reading, one deploy's pages would disagree with each other
      # about when that deploy happened, by minutes. Frozen here, immediately after
      # checkout, and read by every generator through scripts/lib/version.mjs.
      #
      # If this step is ever dropped or renamed the build does not fail here: every
      # page falls back to saying "local build — not a deploy", which the Validate
      # site step greps for and rejects. The failure is loud one step later rather
      # than silent forever.
      - name: Stamp the build
        run: |
          {
            echo "OBOT_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "OBOT_COMMIT=$GITHUB_SHA"
            echo "OBOT_RUN_ID=$GITHUB_RUN_ID"
            echo "OBOT_TRIGGER=$GITHUB_EVENT_NAME"
          } >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install renderer dependency
        run: npm install --no-save marked

      - name: Assemble static content
        run: |
          mkdir -p _site/requirements/design
          cp -r site/. _site/
          cp -r reports _site/reports
          cp requirements/design/*.html _site/requirements/design/ 2>/dev/null || true

      # THE LOCAL-ONLY BOUNDARY, checked before anything builds (#203).
      #
      # Config item text never reaches a public surface — counts only. Four
      # defences already enforced that (location, sentinel, the deploy grep below,
      # gitignore) and every one of them sits downstream of the read: they catch a
      # copy that still carries the marker. A generator that reads the workspace
      # list and renders its parsed headlines carries no marker and walks through
      # all four.
      #
      # So the guard is upstream now — a public generator physically cannot open a
      # file outside this repository — and this step is what stops a generator
      # existing that has not got it. It runs FIRST, so a failure costs a build
      # rather than a publish.
      - name: Check the local-only boundary
        run: node scripts/check_local_only_guard.mjs

      # The shared nav (scripts/lib/nav.mjs) into the two hand-written pages.
      # Must run after the copy above, since it rewrites the _site copies in place.
      - name: Inject the shared header into static pages
        run: node scripts/build_static.mjs

      # The build stamp as data (_site/version.json), so the Navigator sweep relays
      # the verdict the header shows instead of computing a second one from a local
      # clone that is routinely behind the deployed commit.
      - name: Publish the build stamp
        run: node scripts/build_version.mjs

      - name: Render diary
        run: node scripts/render_diary.mjs

      # Draft releases are release candidates (rc-framework) and only visible to
      # a token with push access, which neither the workflow token nor a
      # project-read PAT has. The obot app does (Contents RW on the installed
      # portfolio repos), so mint its token for the release reads. Optional by
      # design: on failure the roadmap's Todo section simply shows no drafts.
      - name: Mint obot app token for draft-release reads
        id: obot-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.OBOT_APP_ID }}
          private-key: ${{ secrets.OBOT_APP_PRIVATE_KEY }}
          owner: jwildfire
          repositories: obot.roadmap,obot.agent,safety.viz,gsm.safety,safety-histogram

      # The Todo section's release-identity rule (scripts/lib/rc.mjs) decides
      # whether an open RC PR and a draft release are one release or two. It is
      # only exercised by live data while both are open — a window of hours — so
      # the test is the standing check that the count on the page is right.
      - name: Test the generators' shared rules
        run: node --test scripts/lib/*.test.mjs

      # The roadmap page set (requirement #211, design D0018): the queue at
      # roadmap.html, the wire one click behind it, and the catalog carrying the
      # complete record that used to be the front door. One generator, one
      # collection pass, so the three pages cannot disagree about the same
      # morning. Replaced build_roadmap_next.mjs and the design spike's
      # build_spike.mjs (#202/#204) when D0018 landed on 2026-08-16.
      - name: Build the roadmap page set
        env:
          RC_TOKEN: ${{ steps.obot-token.outputs.token }}
        run: node scripts/build_roadmap.mjs

      # The audit reading view (_site/audit/index.html, requirement #92) — the
      # roadmap page's Audit fold is for clearing findings, this page is for
      # reading them. Generated from the same committed ledger.
      - name: Build audit page
        run: node scripts/build_audit_page.mjs

      # Per-goal pages + goals.json (requirement #53). Goals are the hub's own
      # goal-labeled issues since #53/#71, so no cross-repo checkout is needed.
      - name: Build goal pages
        run: node scripts/build_goals.mjs

      # The roadmap group's charts page (Cost, from the committed usage data).
      - name: Build analytics
        run: node scripts/build_analytics.mjs

      - name: Build metrics
        run: python3 scripts/build_metrics.py

      # Every agent artifact carries its own one-line description in its page head,
      # written when the artifact is written; the feed renders that line and it is
      # what @jwildfire decides from. Before this check the feed printed a per-type
      # constant ("AI-generated report.") on every row, which nobody read as a
      # defect for six weeks. Fails the deploy rather than publishing the gap.
      - name: Check artifact descriptions
        run: node scripts/check_artifact_descriptions.mjs
      # The decision log (_site/decisions/) — approved by @jwildfire 2026-08-15 as
      # call 2 of the decision-recording artifact. Derived from every artifact's own
      # Decisions section, so it cannot drift from the pages it summarizes; it exits
      # non-zero when an artifact the index calls decided carries no such section.
      - name: Build the decision log
        run: node scripts/build_decisions.mjs

      # Every decision artifact carries a permanent id (D0001) and every question in
      # it a sub-id (D0004.2), because @jwildfire approves by quoting one back in
      # chat. A duplicate id makes an approval ambiguous, and concurrent sessions can
      # compute the same next id without seeing each other — so the collision has to
      # fail here rather than reach the page.
      - name: Check decision ids
        run: |
          node scripts/check_decision_ids.mjs
          node scripts/stamp_decision_ids.mjs --check

      - name: Build news
        run: node scripts/build_news.mjs

      # Package status dashboard (_site/status/index.html), embedded by site/status.html.
      # gh.dash is an R package, so this is the one generator needing an R toolchain.
      # Every step here is continue-on-error: the dashboard is the only page built
      # from other repos, and it must not be able to block the rest of the deploy.
      #
      # gh.dash is checked out and installed as a local source package rather than
      # resolved as github::Gilead-BioStats/gh.dash — pak would resolve that ref with
      # GITHUB_PAT, which here is ROADMAP_TOKEN, and Gilead-BioStats enforces SAML SSO
      # for personal access tokens. actions/checkout uses the workflow token, which
      # reads public repos without an SSO grant.
      # TIMEOUTS ON THE R HALF, and they are the point rather than a tidy-up.
      #
      # Every step below already carries `continue-on-error: true`, and the
      # placeholder step after them runs `if: always()`. The intent could not be
      # clearer: the package status dashboard is optional and must never block the
      # deploy of pages built from this repo's own content.
      #
      # `continue-on-error` absorbs a step that FAILS. It does nothing for a step
      # that HANGS, and there was no timeout anywhere, so the job's 6-hour default
      # was the only backstop. On 2026-08-18 setup-r stalled inside `apt-get
      # update` against the Ubuntu mirrors and produced no output for 42 minutes;
      # two consecutive deploys — one of them carrying work already merged to main
      # — were cancelled at that step with Validate, the local-only guard and the
      # Deploy itself all skipped. Nothing published for the best part of an hour,
      # and the failure looked exactly like a slow build the whole time.
      #
      # A timeout turns the hang into the failure the rest of this already knows
      # how to survive: the step goes red, `continue-on-error` absorbs it, the
      # placeholder publishes, and the site ships without the R dashboard — which
      # is precisely what this section was written to do.
      - uses: r-lib/actions/setup-pandoc@v2
        continue-on-error: true
        timeout-minutes: 5

      - uses: r-lib/actions/setup-r@v2
        continue-on-error: true
        timeout-minutes: 10
        with:
          use-public-rspm: true

      - name: Check out gh.dash
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          repository: Gilead-BioStats/gh.dash
          token: ${{ github.token }}
          path: gh.dash-src

      # deps:: from gh.dash's own DESCRIPTION, so its dependency list is not
      # duplicated here; rmarkdown is a Suggests but the report needs it. gh.dash
      # itself is installed with R CMD INSTALL rather than pak's local:: source —
      # local:: packaged the checkout into a 4 kB stub and failed inside pkgdepends.
      - name: Install gh.dash dependencies
        continue-on-error: true
        timeout-minutes: 15
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: gh.dash-src
          packages: |
            deps::.
            any::rmarkdown

      - name: Install gh.dash
        continue-on-error: true
        timeout-minutes: 10
        run: R CMD INSTALL --no-docs gh.dash-src

      - name: Build package status dashboard
        continue-on-error: true
        timeout-minutes: 10
        run: Rscript scripts/build_status.R

      - name: Publish placeholder if the dashboard did not build
        if: always()
        run: |
          if [ ! -f _site/status/index.html ]; then
            mkdir -p _site/status
            cp site/status-unavailable.html _site/status/index.html
            echo "::warning title=Package status dashboard::not rendered on this run — published the placeholder"
          fi

      # Names the failing assertion. A bare list of `test -f` under `bash -e`
      # reports only "exit code 1", which on a 16-check step means reading the
      # workflow to guess what was missing.
      - name: Validate site
        run: |
          fail=0
          have() { [ -f "_site/$1" ] || { echo "::error title=Missing page::_site/$1 was not produced"; fail=1; }; }
          says() { grep -q "$2" "_site/$1" 2>/dev/null || { echo "::error title=Unexpected page content::_site/$1 does not contain '$2'"; fail=1; }; }

          have index.html;                 says index.html metric-row

          # The roadmap page set (#211). These assertions moved WITH their
          # content when D0018 made the queue the front door: sec-requirements
          # and the view chips are the catalog's, and asserting them on
          # roadmap.html would now pass on a page that does not hold them. That
          # is the exact shape of a silent loss, so each page asserts its own.
          #
          # The queue at roadmap.html: the ranked list container and the NOW
          # strip's live readout. Not a card — zero cards is the goal state.
          have roadmap.html;               says roadmap.html 'id="q-list"'
                                           says roadmap.html 'id="ns-live"'
          # The wire: the stream container and its own NOW strip.
          have wire.html;                  says wire.html 'id="w-stream"'
                                           says wire.html 'id="ns-live"'
          # The catalog: the inventory spine, both filters, the Todo section (RC
          # framework — what is waiting on @jwildfire must never silently drop
          # off), the hierarchy review lane, and the audit fold. The audit
          # section is generated from a committed ledger, so a missing or
          # malformed site/audit/findings.json fails the deploy rather than
          # quietly publishing a roadmap with no audit on it.
          have catalog.html;               says catalog.html sec-requirements
                                           says catalog.html rm-view-btn
                                           says catalog.html rm-chip-btn
                                           says catalog.html sec-todo
                                           says catalog.html sec-hierarchy
                                           says catalog.html hierarchy-proposed
                                           says catalog.html sec-audit
          # The fragment forwarder on the queue. Published pages link into
          # sections that now live on the catalog (README's #sec-audit, the
          # 2026-07-27 diary's #hierarchy-proposed); without it those land on a
          # real page with no such section and nothing looks broken.
                                           says roadmap.html sec-hierarchy
                                           says roadmap.html sec-usage
          have audit/findings.json
          # ap-queue is the container the decision table renders into, and
          # ap-data the embedded ledger it renders from — between them they say
          # the page is the queue (#109) and that it carries real findings.
          have audit/index.html;           says audit/index.html ap-queue
                                           says audit/index.html ap-data
          # roadmap-next.html was the URL the catalog was staged at during its
          # own review in July and was shared in #57; it still redirects there.
          have roadmap-next.html;          says roadmap-next.html catalog.html
          # The design spike's pages (#202/#204) are retired, but D0018's
          # published artifact links to all three, so each URL must keep
          # forwarding to what that direction became rather than 404.
          have roadmap-spike/index.html;   says roadmap-spike/index.html 'url=../roadmap.html'
          have roadmap-spike/queue.html;   says roadmap-spike/queue.html 'url=../roadmap.html'
          have roadmap-spike/wire.html;    says roadmap-spike/wire.html 'url=../wire.html'
          have roadmap-spike/board.html;   says roadmap-spike/board.html 'url=../roadmap.html'
          have goals/index.html
          have goals/goals.json
          # Not a named page: goal filenames come from the goal issues, so
          # asserting on one slug turns "a goal was renamed" into a failed deploy.
          # (It already did, on 8cd5314, while #53's goals were being migrated.)
          ls _site/goals/*.html >/dev/null 2>&1 || { echo "::error title=No goal pages::build_goals produced no goal pages"; fail=1; }
          have status.html
          have status/index.html
          have news.html
          # The decision log. dl-entry is the recorded-decision block and
          # decisions.json the feed the local Operations Dashboard reads — between
          # them they say the page is the log and that it carries real decisions.
          have decisions/index.html;       says decisions/index.html dl-entry
          have decisions/decisions.json
          # The decisions folder's landing page is generated too — it drifted to
          # listing 2 of 12 artifacts while it was hand-maintained.
          have reports/decisions/index.html; says reports/decisions/index.html "Waiting on you"

          # The briefing (#247): the one URL he bookmarks on his phone. Asserting
          # the two headline sections rather than the page alone, because an empty
          # shell at this URL is the failure that matters - he opens it, learns
          # nothing, and stops opening it.
          have reports/briefing/index.html; says reports/briefing/index.html "obot briefing"
                                            says reports/briefing/index.html "Release candidates"
                                            says reports/briefing/index.html "Decisions"
          have diary/index.html
          have reports/index.html
          have reports/autonomous-agent-framework/index.html

          # The Cost section renders from a committed artifact, so a data file
          # that went missing must fail here rather than publish an analytics
          # page that silently says "not generated yet".
          have analytics/index.html;       says analytics/index.html sec-usage
          have usage/usage.json

          # Nav consistency (@jwildfire, 2026-07-25). The nav lived in seven
          # hand-maintained copies and drifted; it now comes from
          # scripts/lib/nav.mjs alone. These assertions are what stops it
          # drifting again: every page carries the top nav, no page carries a
          # stale hand-written copy, and the roadmap group — and only the
          # roadmap group — carries the second row.
          for f in index.html roadmap.html wire.html catalog.html news.html status.html \
                   audit/index.html analytics/index.html diary/index.html goals/index.html \
                   decisions/index.html; do
            # Exactly one shared top nav — two would mean a hand-written copy
            # survived alongside the injected one.
            n=$(grep -c 'aria-label="Site"' "_site/$f" || true)
            [ "$n" = 1 ] || { echo "::error title=Nav count::_site/$f has $n shared top navs, expected 1"; fail=1; }
            for item in '>Home</a>' '>Roadmap</a>' '>News</a>'; do
              grep -q "$item" "_site/$f" \
                || { echo "::error title=Incomplete nav::_site/$f is missing the $item entry"; fail=1; }
            done
            # The marker must never reach a published page.
            grep -q 'SITE-HEADER' "_site/$f" \
              && { echo "::error title=Uninjected nav::_site/$f still contains the SITE-HEADER marker"; fail=1; }

            # The version stamp (#224). The badge is what @jwildfire asked for and it
            # lived on exactly one of these eleven pages before this; asserting it here
            # is what stops it quietly becoming one page's feature again.
            grep -q 'class="version-badge"' "_site/$f" \
              || { echo "::error title=Missing version badge::_site/$f carries the shared header but no version badge"; fail=1; }
            grep -q 'class="version-panel"' "_site/$f" \
              || { echo "::error title=Missing version panel::_site/$f has the badge but nothing for it to open"; fail=1; }

            # THE ONE THAT CATCHES THE SILENT FAILURE. If the `Stamp the build` step is
            # ever dropped, renamed, or moved after the generators, nothing errors:
            # every page simply falls back to the local-build wording and the site
            # deploys looking fine while claiming to be somebody's laptop. This is the
            # assertion that turns that into a failed deploy.
            #
            # MATCHED ON THE RENDERED SHAPE, NOT THE PHRASE. The bare phrase failed the
            # very first deploy that carried it: the changelog entry announcing this
            # guard says the words "local build" in prose, the catalog renders every
            # changelog entry into its audit dialog, and the guard fired on its own
            # announcement. That is obot.agent#58 exactly, and the same fix as hub#209
            # below — assert the executable form. Changelog prose is escaped on the way
            # into the page, so `"` becomes &quot; and this can only match markup that
            # lib/version.mjs actually emitted. scripts/lib/version.test.mjs pins the
            # needle so the two cannot drift apart.
            grep -qF 'class="vs-v">local build' "_site/$f" \
              && { echo "::error title=Local stamp published::_site/$f renders the local-build stamp — the Stamp the build step did not reach the generators"; fail=1; }
          done

          # The published build stamp the Navigator sweep reads. Asserting the real
          # commit is IN it is what proves the stamp is live rather than merely wired —
          # a file containing nulls would satisfy `have` and tell the sweep nothing.
          have version.json
          grep -q "\"commit\": \"$GITHUB_SHA\"" _site/version.json \
            || { echo "::error title=Build stamp is not this build::_site/version.json does not carry $GITHUB_SHA"; fail=1; }
          # The same question asked of the data rather than the markup, where no prose
          # can ever reach it. `ci` is true only when the stamping step supplied both
          # OBOT_BUILT_AT and OBOT_COMMIT, so this is the stamp saying it is a real
          # deploy in a field nobody writes sentences into.
          grep -q '"ci": true' _site/version.json \
            || { echo "::error title=Unstamped build::_site/version.json reports ci=false — the Stamp the build step did not reach the generators"; fail=1; }

          for f in roadmap.html wire.html catalog.html status.html audit/index.html \
                   analytics/index.html goals/index.html decisions/index.html; do
            grep -q 'nav class="site sub"' "_site/$f" \
              || { echo "::error title=Missing sub-nav::_site/$f is in the roadmap group but has no second nav row"; fail=1; }
          done

          # hub#209. The browser copy of the release-identity rule is emitted
          # from scripts/lib/rc.mjs rather than hand-typed into a template
          # literal, because the hand-typed mirror lost its backslashes on the
          # way into the page and shipped a pattern that matched no version at
          # all — for weeks, invisibly, while every source-level test passed.
          #
          # The positive assertion is the one that matters: the escaped pattern
          # must BE on the page. An absence check alone would also pass on a page
          # that had lost the whole re-check script, which is the same silent
          # failure wearing different clothes. The negative check is kept as well,
          # narrowed to the executable shape (`match(/…`) so that prose describing
          # the bug does not fail a page that is correct — which it did.
          for f in roadmap.html catalog.html; do
            grep -qF '\\bv?(\\d+)\\.(\\d+)' "_site/$f" \
              || { echo "::error title=hub#209 regression::_site/$f has lost the escaped release-key pattern emitted by lib/rc.mjs"; fail=1; }
            grep -qF 'match(/v?(d+)' "_site/$f" \
              && { echo "::error title=hub#209 regression::_site/$f carries a release-key pattern whose escapes were eaten by a template literal"; fail=1; }
          done
          for f in index.html news.html diary/index.html; do
            grep -q 'nav class="site sub"' "_site/$f" \
              && { echo "::error title=Unexpected sub-nav::_site/$f is outside the roadmap group but shows its second nav row"; fail=1; }
          done

          [ "$fail" = 0 ] || { echo "::error::site validation failed — see the errors above"; exit 1; }
          echo "site validation passed"

      # Blockers-list guard (decision artifact 2026-08-15-blockers-list, BL2 layer 3 —
      # approved by @jwildfire 2026-08-15). The workspace-local blockers file opens
      # with a fixed local-only marker comment; if any copy of its content ever
      # reaches the assembled site, fail the deploy rather than publish it. The
      # marker is composed from two halves here so that pages *documenting* this
      # guard can never trip it (the prose-false-positive lesson, obot.agent#58).
      #
      # `-R`, not `-r`, and the difference is the whole guard (#203). `grep -r`
      # follows symlinks only when they are named on the command line, so a
      # symlink inside _site pointing at local content reads as "no hits" — while
      # actions/upload-pages-artifact tars with --dereference and publishes the
      # target's bytes as a regular file. Reproduced both halves on 2026-08-17: the
      # -r grep passed and the tar shipped the content. `-R` follows symlinks in
      # recursion, so grep and tar finally agree about what _site contains.
      - name: Guard against local-only content
        run: |
          M1="LOCAL-ONLY: never publish"
          M2=", never commit"
          hits=$(grep -RlF "${M1}${M2}" _site || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error title=Local-only content in site::the local blockers sentinel appears in the assembled site (files above) — deploy blocked"
            exit 1
          fi
          echo "local-only guard passed"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
