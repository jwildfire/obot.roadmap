name: Requirement
description: A roadmap requirement under an objective, with its definition of done and its tasks in implementation repos.
title: "{title}"
labels:
  - requirement
body:
  - type: markdown
    attributes:
      value: |
       A requirement under the [issue contract](../../docs/issue-contract.md): a sub-issue of exactly one objective, with task issues in implementation repos linked as its sub-issues. Business Requirement and Overview are required at creation; Design, Definition of done and Tasks must be populated before its session starts. A requirement is sized for one session — the tasks one `/goal` run can close and prove — and one release.

       Below the sections, after a `---` rule, every requirement says who wrote it and who approved it. The web form cannot emit it — a form field would render as another `###` section — so paste these two lines at the foot of the body after submitting, or file with `node scripts/provenance.mjs stamp`:

       ```
       Authored by: <the agent or person who wrote this>
       Approved by: EMPTY
       ```

       `EMPTY` means nobody has approved it, which is the normal and correct state for work an agent wrote. Replace it only with a citation that resolves — his sign-off comment on the objective, a decision id (`D0018.1`) or his native review (`owner/repo#123 review`) — and add a third line, `Beyond the approval:`, saying what the citation does not cover. Never prose. See [Who decided it](../../docs/issue-contract.md#who-decided-it).

  - type: textarea
    id: business_requirement
    attributes:
      label: Business Requirement
      description: "What need does this address? Who benefits, and what does success look like?"
      placeholder: |
        State the user-facing or operational need in plain language.
        Avoid technical detail — capture the *why*, not the *how*.
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: "Short technical summary + impact. Must be populated when the issue is created."
      placeholder: |
        Briefly describe the proposed approach and which packages /
        repos / users it affects. Detailed design lives in the Design section.
    validations:
      required: true

  - type: textarea
    id: data_requirement
    attributes:
      label: Data Requirement
      description: |
        What source data must exist for this requirement to be feasible?
        List domains, tables, columns, or data sources required, and their availability.
      placeholder: |
        **Required domains / tables:**

        **Required columns:**

        **Data source / system:**

        **Availability status:** Confirmed / Unconfirmed / TBD

  - type: textarea
    id: design
    attributes:
      label: Design
      description: |
        The technical design: components, affected packages, the approach.
        Must be populated before Tasks are filed. For complex requirements,
        add a self-contained page under `requirements/design/{issue_number}_design.html`
        and link it here.
      placeholder: |
        **Summary:**

        **Affected packages / repos:**

        **Design artifacts:** requirements/design/{issue_number}_design.html

  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of done
      description: |
        The observable end state, how a reader who has memorised nothing can check it
        (a command and what it prints, a URL and what it shows, a test and its result),
        and the release it ships in. Write it so it can fail — "works as expected" is
        not a definition of done.
      placeholder: |
        End state:
        Proof:
        Ships in:
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: |
        One line per task issue, mirrored from the sub-issue links. Each task lives in
        exactly one implementation repo with its own definition of done and milestone.
        Must be populated before the requirement's session starts.
      placeholder: |
        - repo#N — title
