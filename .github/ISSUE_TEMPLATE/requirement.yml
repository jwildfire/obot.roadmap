name: Requirement
description: A requirement under an objective — one session's worth of work, with its definition of done and its tasks in implementation repos.
title: "{title}"
labels:
  - requirement
  - "status: backlog"
body:
  - type: markdown
    attributes:
      value: |
        A requirement under the [issue contract](../../docs/issue-contract.md): a sub-issue of exactly one objective, sized for one session — the tasks one `/goal` run can close and prove — and one release. Objective, Business Requirement and Overview are required at filing; Design, Definition of done and Tasks must be populated, and every task milestoned, before the requirement is `status: ready`. Give it the hub's delivery-target milestone on filing. End the body with the drafted-by line after a `---` rule; nothing else goes in the footer.

  - type: input
    id: objective
    attributes:
      label: Objective
      description: "The objective this requirement belongs to; the sub-issue link is made after filing."
      placeholder: "#N"
    validations:
      required: true

  - type: textarea
    id: business_requirement
    attributes:
      label: Business Requirement
      description: "What need does this address? Who benefits, and what does success look like?"
      placeholder: |
        State the user-facing or operational need in plain language.
        Avoid technical detail — capture the *why*, not the *how*.
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: "The approach in a paragraph, and the repositories the tasks will live in."
      placeholder: |
        Briefly describe the proposed approach.

        **Repositories:** safety.viz, gsm.safety
    validations:
      required: true

  - type: textarea
    id: data_requirement
    attributes:
      label: Data Requirement
      description: |
        Only when data is involved: the domains, columns and sources the work needs,
        and their availability. Leave it empty otherwise.
      placeholder: |
        **Required domains / tables:**

        **Required columns:**

        **Availability:** Confirmed / Unconfirmed / TBD

  - type: textarea
    id: design
    attributes:
      label: Design
      description: |
        The technical design: components, affected packages, the approach.
        Must be populated before Tasks are filed. For complex requirements,
        add a self-contained page under `requirements/design/{issue_number}_design.html`
        and link it here.
      placeholder: |
        **Summary:**

        **Design artifacts:** requirements/design/{issue_number}_design.html

  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of done
      description: |
        The observable end state, how a reader who has memorised nothing can check it
        (a command and what it prints, a URL and what it shows, a test and its result),
        and the release it ships in. Write it so it can fail — "works as expected" is
        not a definition of done. This is what the session's `/goal` condition is built from.
      placeholder: |
        End state:
        Proof:
        Ships in:
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: |
        One line per task issue, mirrored from the sub-issue links. Each task lives in
        exactly one implementation repo with its own definition of done and milestone.
        Must be populated before the requirement is ready.
      placeholder: |
        - title (repo#N)
