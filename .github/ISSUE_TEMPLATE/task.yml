name: Task
description: A task on this repository under a requirement — one pull request's worth of work with its definition of done.
title: "{verb} {what}"
body:
  - type: markdown
    attributes:
      value: |
        A task under the [issue contract](../../docs/issue-contract.md): a sub-issue of exactly one requirement, sized to one pull request, closed by that pull request's `Closes #N` line with the evidence in the PR body. Give it the release milestone before any work starts. The same shape is used for tasks filed in the implementation repositories.

  - type: input
    id: parent
    attributes:
      label: Parent
      description: "The requirement this task belongs to."
      placeholder: "jwildfire/obot.roadmap#N"
    validations:
      required: true

  - type: textarea
    id: what_changes
    attributes:
      label: What changes
      description: "Two or three sentences: the change, where in the repo, and what it must not change."
    validations:
      required: true

  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of done
      description: "End state, proof (a command and what it prints, a URL and what it shows, a test and its result), and the release it ships in. Write it so it can fail."
      placeholder: |
        - End state:
        - Proof:
        - Ships in:
    validations:
      required: true
