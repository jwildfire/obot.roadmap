name: Objective
description: An objective — the root of an issue tree of requirements and tasks; closes when the tree is closed.
title: "Objective: {title}"
labels:
  - objective
assignees:
  - jwildfire
body:
  - type: markdown
    attributes:
      value: |
        An objective is the root of an issue tree under the [issue contract](../../docs/issue-contract.md): requirement issues linked as sub-issues, each with task issues in one implementation repo, every node with a definition of done and a milestone. It is complete when every requirement under it is closed. @jwildfire owns the body and the sub-issue links; agents comment and never edit either. A session runs one requirement at a time, and only after he has signed the objective's tree off in a comment.

  - type: textarea
    id: slug_comment
    attributes:
      label: Slug (hidden comment)
      description: "Replace your-slug-here with a unique kebab-case slug — it names the objective's site page. The comment is invisible on the rendered issue."
      value: |
        <!-- objective-slug: your-slug-here -->
    validations:
      required: true

  - type: textarea
    id: intent
    attributes:
      label: Intent
      description: "What direction does this objective set, in @jwildfire's words?"
    validations:
      required: true

  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of done
      description: "The whole objective's end state, how it is proven, and the release it ships in. Write it so it can fail."
      placeholder: |
        End state:
        Proof:
        Ships in:
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: "The requirement issues under this objective, one per line, in the order their sessions should run. Membership is the sub-issue links; this list says the order."
      placeholder: |
        1. title (#N)
        2. title (#N)

  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries
      description: "What a session should weigh that the requirements do not say: constraints, prerequisites, what beats what, the cut line if the calendar slips."
