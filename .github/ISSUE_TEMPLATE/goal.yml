name: Goal
description: A standing goal — the direction issue that groups roadmap requirements (#53/#71).
title: "Goal: {title}"
labels:
  - goal
assignees:
  - jwildfire
body:
  - type: markdown
    attributes:
      value: |
        A goal issue is the source of truth for a standing direction of work. It stays open indefinitely — closing it retires the goal. The body is prose only: membership is whatever is linked as sub-issues (requirements or lightweight tasks), generated at read time — nothing list-like is hand-maintained here, and priority is the selecting session's judgment, not list order (#53 v2). The `--auto` policy binding (active/paused, grant profile, repo-level backlog feeds) lives in `obot.agent/goals/registry.json`, not here. Direction and membership are maintained by @jwildfire; autonomous sessions propose changes as comments and never edit goal issues.

  - type: textarea
    id: slug_comment
    attributes:
      label: Slug (hidden comment)
      description: "Replace your-slug-here with a unique kebab-case slug — it names the goal's site page and obot-auto --goal argument. The comment is invisible on the rendered issue."
      value: |
        <!-- goal-slug: your-slug-here -->
    validations:
      required: true

  - type: textarea
    id: intent
    attributes:
      label: Intent
      description: "What direction does this goal set? What does done look like?"
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and weights
      description: "What a selecting session should weigh that the member issues don't say: constraints, prerequisites, what beats what."
    validations:
      required: false
