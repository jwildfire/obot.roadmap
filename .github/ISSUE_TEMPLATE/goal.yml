name: Goal
description: A standing goal — the direction issue that groups roadmap requirements (#53/#71).
title: "Goal: {title}"
labels:
  - goal
assignees:
  - jwildfire
body:
  - type: markdown
    attributes:
      value: |
        A goal issue is the source of truth for a standing direction of work. It stays open indefinitely — closing it retires the goal. Requirements that advance the goal are linked as sub-issues; the fenced YAML block carries what sub-issue links can't (anchor priority order, repo-level backlog feeds). The `--auto` policy binding (active/paused, grant profile) lives in `obot.agent/goals/registry.json`, not here. Direction and membership are maintained by @jwildfire; autonomous sessions propose changes as comments and never edit goal issues.

  - type: textarea
    id: machine_block
    attributes:
      label: Machine-readable block
      description: "The YAML block --auto selection and the goal pages parse. Keep it the first fenced yaml block in the issue."
      value: |
        ```yaml
        slug: <kebab-case-slug>       # unique; obot-auto --goal <slug>
        anchors:                      # hub requirements that feed this goal, priority order
          - jwildfire/obot.roadmap#N
        backlog: []                   # secondary feed: hub issues or owner/repo issue backlogs
        ```
    validations:
      required: true

  - type: textarea
    id: intent
    attributes:
      label: Intent
      description: "What direction does this goal set? What does done look like?"
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and weights
      description: "What a selecting session should weigh that the member issues don't say: constraints, prerequisites, what beats what."
    validations:
      required: false
